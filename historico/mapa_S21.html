<script>

const streamlitData = window.streamlitData || {
    data: [],
    config: {},
    recordCount: 0,
    polygons: []
};

let map = null;
let polygonLayer = null;
let markerLayer = null;
let isolineLayer = null;
let allPolygons = [];

// ============================================================
// CONFIGURACIÓN DE UMBRALES Y COLORES
// ============================================================
const UMBRALES = {
    verde: 1,
    amarillo: 2,
    naranja: 4,
    rojo: 4
};

const COLORES = {
    verde: "#00C800",
    amarillo: "#FFD700",
    naranja: "#FF8C00",
    rojo: "#E63946"
};

// ============================================================
// OBTENER COLOR SEGÚN CAPTURAS
// ============================================================
function getColorByCapturas(valor) {
    const v = parseFloat(valor) || 0;
    if (v === 0) return COLORES.verde;
    if (v <= 1) return COLORES.amarillo;
    if (v <= 2) return COLORES.naranja;
    return COLORES.rojo;
}

function getCategoryLabel(valor) {
    const v = parseFloat(valor) || 0;
    if (v === 0) return "0 capturas";
    if (v <= 1) return "~1 captura";
    if (v <= 2) return "~2 capturas";
    return ">2 capturas";
}

// ============================================================
// COLORES POR MÓDULO
// ============================================================
const COLORES_MOD = [
    "#1565C0", // MOD 1 - azul
    "#6A1B9A", // MOD 2 - morado
    "#E65100", // MOD 3 - naranja
    "#B71C1C", // MOD 4 - rojo
    "#1B5E20", // MOD 5 - verde oscuro
    "#00838F", // MOD 6 - cyan
    "#F9A825", // MOD 7 - amarillo oscuro
    "#37474F", // MOD 8 - gris
];

function getColorMod(mod_n) {
    if (!mod_n) return "#555555";
    const idx = (parseInt(mod_n) - 1) % COLORES_MOD.length;
    return COLORES_MOD[idx];
}

// ============================================================
// FUNCIONES DE NORMALIZACIÓN
// ============================================================
function _norm_mod(val) {
    if (!val) return null;
    const s = String(val).toUpperCase().trim();
    const match = s.match(/(\d+)/);
    return match ? parseInt(match[1]) : null;
}

function _norm_tur(val) {
    if (!val) return null;
    const s = String(val).toUpperCase().trim();
    let match = s.match(/T[\s\-]?(\d+)/);
    if (match) {
        const n = parseInt(match[1]);
        return n <= 20 ? n : null;
    }
    match = s.match(/^\s*T?(\d+)\s*$/);
    if (match) {
        const n = parseInt(match[1]);
        return n <= 20 ? n : null;
    }
    return null;
}

function _norm_lote(val) {
    if (!val) return null;
    let s = String(val).trim().toUpperCase();
    if (!s || s === 'NAN' || s === 'NONE') return null;
    const match = s.match(/^(\d+)\.0+$/);
    if (match) return match[1];
    s = s.replace(/-/g, '');
    return s;
}

function _fundo_to_aq(fundo) {
    if (!fundo) return null;
    const fundoUpper = String(fundo).toUpperCase().trim();
    const mapping = {
        'ARENA AZUL':   'AQ1',
        'QURI ALLPA':   'AQ1',
        'KAWSAY ALLPA': 'AQ1',
        'AYLLU ALLPA':  'AQ1',
        'SANTA TERESA': 'AQ2',
        'VIVADIS':      'AQ2',
    };
    return mapping[fundoUpper] || null;
}

// ============================================================
// MOSTRAR/OCULTAR LOADING
// ============================================================
function showLoading(text = 'Procesando isolíneas y puntos...') {
    const spinner = document.getElementById('loadingSpinner');
    if (spinner) {
        document.getElementById('loadingText').textContent = text;
        spinner.style.display = 'block';
    }
}

function hideLoading() {
    const spinner = document.getElementById('loadingSpinner');
    if (spinner) {
        spinner.style.display = 'none';
    }
}

// ============================================================
// INTERPOLACIÓN IDW
// ============================================================
function interpolateIDW(x, y, points, values, power = 2) {
    if (points.length === 0) return 0;
    if (points.length === 1) return values[0];

    let totalWeight = 0;
    let totalValue = 0;
    const distances = [];

    for (let i = 0; i < points.length; i++) {
        const [py, px] = points[i];
        const dist = Math.sqrt((x - px) ** 2 + (y - py) ** 2);
        distances.push(dist);
        if (dist < 1e-10) return values[i];
    }

    const minDist = Math.min(...distances);
    const normalizedMinDist = Math.max(minDist, 0.0001);

    for (let i = 0; i < points.length; i++) {
        const dist = Math.max(normalizedMinDist / 100, distances[i]);
        const weight = 1 / (dist ** power);
        totalWeight += weight;
        totalValue += values[i] * weight;
    }

    return totalValue / totalWeight;
}

// ============================================================
// CREAR GRILLA INTERPOLADA
// ============================================================
function createInterpolationGrid(lotes, bounds, gridSize = 50) {
    const [latMin, lonMin, latMax, lonMax] = bounds;
    const points = lotes.map(l => [l.lat, l.lon]);
    const values = lotes.map(l => l.capturas);
    const grid = [];
    for (let i = 0; i < gridSize; i++) {
        grid[i] = [];
        for (let j = 0; j < gridSize; j++) {
            const lat = latMax - (i / gridSize) * (latMax - latMin);
            const lon = lonMin + (j / gridSize) * (lonMax - lonMin);
            grid[i][j] = interpolateIDW(lon, lat, points, values, 2);
        }
    }
    return grid;
}

// ============================================================
// MARCHING SQUARES
// ============================================================
function extractContoursMarching(grid, bounds, levels) {
    const [latMin, lonMin, latMax, lonMax] = bounds;
    const gridSize = grid.length;
    const contours = [];

    for (const level of levels) {
        const paths = [];
        for (let i = 0; i < gridSize - 1; i++) {
            for (let j = 0; j < gridSize - 1; j++) {
                const v00 = grid[i][j];
                const v10 = grid[i + 1][j];
                const v01 = grid[i][j + 1];
                const v11 = grid[i + 1][j + 1];
                const caseIdx =
                    (v00 > level ? 1 : 0) |
                    (v10 > level ? 2 : 0) |
                    (v01 > level ? 4 : 0) |
                    (v11 > level ? 8 : 0);
                if (caseIdx === 0 || caseIdx === 15) continue;
                const edges = [];
                if ((v00 > level) !== (v10 > level)) {
                    const t = Math.abs(level - v00) / Math.abs(v10 - v00 || 1);
                    edges.push([i + Math.max(0, Math.min(1, t)), j]);
                }
                if ((v00 > level) !== (v01 > level)) {
                    const t = Math.abs(level - v00) / Math.abs(v01 - v00 || 1);
                    edges.push([i, j + Math.max(0, Math.min(1, t))]);
                }
                if ((v10 > level) !== (v11 > level)) {
                    const t = Math.abs(level - v10) / Math.abs(v11 - v10 || 1);
                    edges.push([i + Math.max(0, Math.min(1, t)), j + 1]);
                }
                if ((v01 > level) !== (v11 > level)) {
                    const t = Math.abs(level - v01) / Math.abs(v11 - v01 || 1);
                    edges.push([i + 1, j + Math.max(0, Math.min(1, t))]);
                }
                if (edges.length >= 2) {
                    const path = edges.map(([pi, pj]) => [
                        latMax - (pi / gridSize) * (latMax - latMin),
                        lonMin + (pj / gridSize) * (lonMax - lonMin)
                    ]);
                    paths.push(path);
                }
            }
        }
        if (paths.length > 0) contours.push({ level, paths });
    }
    return contours;
}

// ============================================================
// DOUGLAS-PEUCKER
// ============================================================
function douglasPeucker(points, epsilon) {
    if (points.length < 3) return points;
    let maxDist = 0;
    let maxIdx = 0;
    const start = points[0];
    const end = points[points.length - 1];
    for (let i = 1; i < points.length - 1; i++) {
        const dist = perpendicularDistance(points[i], start, end);
        if (dist > maxDist) { maxDist = dist; maxIdx = i; }
    }
    if (maxDist > epsilon) {
        const left  = douglasPeucker(points.slice(0, maxIdx + 1), epsilon);
        const right = douglasPeucker(points.slice(maxIdx), epsilon);
        return [...left.slice(0, -1), ...right];
    } else {
        return [start, end];
    }
}

function perpendicularDistance(point, lineStart, lineEnd) {
    const [px, py] = point;
    const [x1, y1] = lineStart;
    const [x2, y2] = lineEnd;
    const numerator   = Math.abs((y2 - y1) * px - (x2 - x1) * py + x2 * y1 - y2 * x1);
    const denominator = Math.sqrt((y2 - y1) ** 2 + (x2 - x1) ** 2);
    return denominator === 0 ? 0 : numerator / denominator;
}

// ── Zoom threshold ──
const ZOOM_CIRCULOS = 16;

function _actualizarCapasPorZoom() {
    if (!window._badgeLayer || !window._circleLayer) return;
    const z = map.getZoom();
    if (z >= ZOOM_CIRCULOS) {
        if (map.hasLayer(window._badgeLayer))   map.removeLayer(window._badgeLayer);
        if (!map.hasLayer(window._circleLayer)) window._circleLayer.addTo(map);
    } else {
        if (map.hasLayer(window._circleLayer))  map.removeLayer(window._circleLayer);
        if (!map.hasLayer(window._badgeLayer))  window._badgeLayer.addTo(map);
    }
}
// ============================================================
// PANEL DE ALERTAS (capturas > 2, agrupado por fundo)
// ============================================================
function renderAlertPanel() {
    const lotes = streamlitData.lotes || [];
    const panel = document.getElementById('alertPanel');
    if (!panel) return;

    // ── Filtrar solo los que superan umbral ──
    const alertas = lotes.filter(d => d.capturas > 2);

    if (alertas.length === 0) {
        panel.style.display = 'none';
        return;
    }

    // ── Agrupar por fundo ──
    const porFundo = {};
    alertas.forEach(d => {
        const fundo = d.fundo || "—";
        if (!porFundo[fundo]) porFundo[fundo] = [];
        porFundo[fundo].push(d);
    });

    // ── Ordenar cada fundo por capturas desc ──
    Object.keys(porFundo).forEach(f => {
        porFundo[f].sort((a, b) => b.capturas - a.capturas);
    });

    // ── Ordenar fundos por total de capturas desc ──
    const fundosOrdenados = Object.keys(porFundo).sort((a, b) => {
        const totalA = porFundo[a].reduce((s, d) => s + d.capturas, 0);
        const totalB = porFundo[b].reduce((s, d) => s + d.capturas, 0);
        return totalB - totalA;
    });

    const maxCap = Math.max(...alertas.map(d => d.capturas));

    let html = `
        <div class="alert-panel-title">🔴 Alertas Fundo / Turno</div>
        <div class="alert-panel-sub">Capturas > 2 · Fundo → Turno (mayor a menor)</div>
    `;

    fundosOrdenados.forEach(fundo => {
        const items  = porFundo[fundo];
        const total  = items.reduce((s, d) => s + d.capturas, 0);

        html += `
            <div class="alert-fundo">
                <span>📍 ${fundo}</span>
                <span class="alert-fundo-total">${total} 🪰</span>
            </div>
        `;

        items.forEach(d => {
            const modLabel   = d.modulo ? d.modulo.replace(/.*?(\d+).*/i, 'M$1') : "";
            const turnoLabel = d.turno  ? d.turno.replace(/.*T\s*0*(\d+).*/i, 'T$1') : "";
            const pct        = Math.round((d.capturas / maxCap) * 100);

            html += `
                <div class="alert-row">
                    <span class="alert-turno">${modLabel}-${turnoLabel}</span>
                    <span class="alert-cap">${d.capturas} 🪰</span>
                </div>
                <div class="alert-bar" style="width:${pct}%;"></div>
            `;
        });
    });

    panel.innerHTML = html;
    panel.style.display = 'block';
}

function renderPolygons(polygons) {
    const polygsNormalized = polygons.map(poly => ({
        ...poly,
        mod_n:     poly.mod_n     !== undefined ? poly.mod_n     : null,
        tur_n:     poly.tur_n     !== undefined ? poly.tur_n     : null,
        fundo_aq:  poly.fundo_aq  !== undefined ? poly.fundo_aq  : null,
        lote_name: poly.lote      || poly.lote_name || null
    }));

    allPolygons  = polygsNormalized;
    let bounds   = L.latLngBounds();
    polygonLayer = L.featureGroup();

    polygsNormalized.forEach((poly) => {
        try {
            if (!poly.coords || poly.coords.length < 3) return;

            poly.coords.forEach(c => bounds.extend(c));

            const color = getColorMod(poly.mod_n);

            L.polygon(poly.coords, {
                color:       color,
                fillColor:   color,
                fillOpacity: 0,       // sin relleno
                weight:      2.5,
                opacity:     0.85,
                interactive: false,   // sin popup ni click
            }).addTo(polygonLayer);

        } catch (e) {
            console.error('Error en polígono:', e);
        }
    });

    polygonLayer.addTo(map);
    return bounds;
}

// ============================================================
// INICIALIZAR MAPA
// ============================================================
async function initMap() {

    if (polygonLayer) { polygonLayer.clearLayers(); polygonLayer = null; }
    if (markerLayer)  { markerLayer.clearLayers();  markerLayer  = null; }
    if (isolineLayer) { map && map.removeLayer(isolineLayer); isolineLayer = null; }
    if (map)          { map.off(); map.remove(); map = null; }

    const container = document.getElementById('mapContainer');
    if (!container) {
        console.error('❌ mapContainer no encontrado');
        return;
    }

    map = L.map('mapContainer', {
        attributionControl: true,
        zoomControl: true,
        zoomAnimation: false,
        fadeAnimation: false,
        markerZoomAnimation: false
    }).setView([-8.345, -79.160], 13);

    L.tileLayer(
        'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
        {
            attribution: '&copy; OpenStreetMap &copy; CARTO',
            maxZoom: 19,
            minZoom: 10,
            crossOrigin: true
        }
    ).addTo(map);

    map.whenReady(() => {
        setTimeout(() => map.invalidateSize(true), 500);
    });

    L.control.scale({ position: 'bottomleft' }).addTo(map);

    try {
        const polygons = streamlitData.polygons || [];
        if (polygons.length > 0) {
            const bounds = renderPolygons(polygons);
            if (bounds && bounds.isValid()) {
                setTimeout(() => {
                    map.fitBounds(bounds, { padding: [40, 40] });
                }, 300);
            }
        }

        await new Promise(r => setTimeout(r, 10));

        const modo = streamlitData.config?.modo_color || "Normal";

        if (modo === "Normal") {
            renderPuntos();
            map.on('zoomend', _actualizarCapasPorZoom);

        } else if (modo === "Espectral") {
            renderEspectral();
            renderPuntos();
            map.on('zoomend', _actualizarCapasPorZoom);

        } else if (modo === "Curvas de Nivel") {
            renderContornosGauss();
            renderPuntos();
            map.on('zoomend', _actualizarCapasPorZoom);
        }

        if (markerLayer) markerLayer.bringToFront();

        updateLegend();

        document.getElementById('recordCount').textContent = streamlitData.recordCount || 0;
        document.getElementById('modoInfo').textContent =
            modo === "Normal"    ? "⚫ Puntos por lote" :
            modo === "Espectral" ? "🌈 Espectral + Puntos" :
                                   "➖ Curvas de nivel + Puntos";
        renderAlertPanel();
        hideLoading();

    } catch (error) {
        console.error('❌ Error en initMap:', error);
        hideLoading();
    }
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => initMap());
} else {
    initMap();
}

</script>
